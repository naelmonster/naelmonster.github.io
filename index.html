<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피리부는 사나이 – 레기온 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --u: min(1px, calc(100vw / 720)); --accent: #E5534B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #111113; }
  body { color: #ECEAE6; font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { width: calc(720 * var(--u)); margin: 0 auto; padding: 0 calc(44 * var(--u)) calc(48 * var(--u)); display: flex; flex-direction: column; gap: calc(24 * var(--u)); }
  .hero { position: relative; height: calc(420 * var(--u)); margin: 0 calc(-44 * var(--u)); overflow: hidden; }
  .hero .photo { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; display: block; }
  .hero .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; background: linear-gradient(to bottom, rgba(17,17,19,0) 0%, rgba(17,17,19,0.72) 50%, #111113 100%); }
  .hero .title { position: absolute; left: 50%; bottom: calc(22 * var(--u)); transform: translateX(-50%); width: calc(580 * var(--u)); filter: drop-shadow(0 calc(4 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,0.65)); }
  .chip { position: absolute; top: calc(20 * var(--u)); left: calc(20 * var(--u)); background: rgba(17,17,19,0.78); border: 1px solid #D9B26A; color: #F2D594; font-size: max(11px, calc(13 * var(--u))); font-weight: 900; letter-spacing: 0.06em; padding: calc(6 * var(--u)) calc(12 * var(--u)); border-radius: 999px; }
  .servers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(10 * var(--u)); }
  .srv { border-radius: calc(10 * var(--u)); padding: calc(12 * var(--u)) calc(16 * var(--u)); display: flex; align-items: center; justify-content: space-between; gap: calc(10 * var(--u)); color: #111113; min-height: calc(48 * var(--u)); }
  .srv .lab { display: flex; align-items: center; gap: calc(8 * var(--u)); font-size: max(12px, calc(14 * var(--u))); font-weight: 900; white-space: nowrap; }
  .srv .vs { font-size: max(9px, calc(11 * var(--u))); font-weight: 900; background: #111113; padding: calc(3 * var(--u)) calc(7 * var(--u)); border-radius: calc(4 * var(--u)); letter-spacing: 0.08em; }
  .srv .name { font-size: calc(24 * var(--u)); font-weight: 900; line-height: 1; white-space: nowrap; }
  .divider { display: flex; align-items: center; gap: calc(16 * var(--u)); margin: calc(4 * var(--u)) calc(-44 * var(--u)) 0; }
  .divider span { flex: 1; height: calc(3 * var(--u)); min-height: 2px; background: #ECEAE6; }
  .divider h2 { margin: 0; font-size: max(14px, calc(20 * var(--u))); line-height: 1; font-weight: 900; letter-spacing: 0.12em; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: calc(6 * var(--u)); }
  .week button { position: relative; border: 0; border-radius: calc(8 * var(--u)); background: #19191C; color: #ECEAE6; font-family: inherit; cursor: pointer; padding: calc(10 * var(--u)) calc(2 * var(--u)); display: flex; flex-direction: column; align-items: center; gap: calc(4 * var(--u)); min-height: 44px; justify-content: center; }
  .week .d { font-size: max(13px, calc(14 * var(--u))); font-weight: 700; }
  .week .c { font-size: max(10px, calc(12 * var(--u))); font-weight: 500; color: #9C9CA3; white-space: nowrap; }
  .week button[aria-pressed="true"] { background: var(--accent); color: #111113; }
  .week button[aria-pressed="true"] .d { font-weight: 900; }
  .week button[aria-pressed="true"] .c { color: #111113; font-weight: 700; }
  .week button.today::after { content: ""; position: absolute; top: calc(6 * var(--u)); right: calc(6 * var(--u)); width: calc(6 * var(--u)); height: calc(6 * var(--u)); min-width: 4px; min-height: 4px; border-radius: 50%; background: var(--accent); }
  .week button.today[aria-pressed="true"]::after { background: #111113; }
  .main { background: #19191C; border: 1px solid #2A2A2E; border-radius: calc(14 * var(--u)); padding: calc(28 * var(--u)) calc(32 * var(--u)); display: flex; flex-direction: column; gap: calc(10 * var(--u)); }
  .main .lab { font-size: max(11px, calc(14 * var(--u))); font-weight: 900; color: var(--accent); letter-spacing: 0.16em; }
  .main .lab.gray { color: #9C9CA3; }
  .main .row { display: flex; align-items: baseline; gap: calc(22 * var(--u)); }
  .main .row span { font-size: calc(64 * var(--u)); line-height: 1; font-weight: 900; letter-spacing: -0.01em; }
  .main .row .n { color: var(--accent); }
  .main .sub { font-size: max(13px, calc(17 * var(--u))); color: #C9C6C0; }
  .main .none { font-size: calc(30 * var(--u)); font-weight: 700; line-height: 1.3; color: #FFFFFF; }
  .next { margin-top: calc(8 * var(--u)); padding-top: calc(14 * var(--u)); border-top: 1px solid #2A2A2E; display: flex; align-items: baseline; flex-wrap: wrap; gap: calc(6 * var(--u)) calc(12 * var(--u)); font-size: max(13px, calc(17 * var(--u))); color: #C9C6C0; }
  .next b { color: #FFFFFF; font-weight: 900; }
  .next .left { margin-left: auto; color: var(--accent); font-weight: 900; }
  .sec-lab { font-size: max(11px, calc(14 * var(--u))); font-weight: 700; letter-spacing: 0.16em; color: #9C9CA3; margin: 0 0 calc(10 * var(--u)); }
  .boss { background: #19191C; border-radius: calc(12 * var(--u)); padding: calc(18 * var(--u)) calc(20 * var(--u)); display: flex; align-items: center; gap: calc(20 * var(--u)); }
  .boss + .boss { margin-top: calc(10 * var(--u)); }
  .boss .who { width: calc(112 * var(--u)); flex-shrink: 0; display: flex; flex-direction: column; gap: calc(4 * var(--u)); }
  .boss .who b { font-size: calc(30 * var(--u)); line-height: 1.1; font-weight: 900; color: #F4F1EC; }
  .boss .who small { font-size: max(11px, calc(14 * var(--u))); font-weight: 700; color: #9C9CA3; }
  .times { display: flex; flex-wrap: wrap; gap: calc(8 * var(--u)); }
  .times span { font-size: calc(28 * var(--u)); line-height: 1; font-weight: 900; color: #FFFFFF; background: #26262B; border-radius: calc(8 * var(--u)); padding: calc(10 * var(--u)) calc(14 * var(--u)); font-variant-numeric: tabular-nums; }
  .notice { border-top: 1px solid #2A2A2E; padding-top: calc(16 * var(--u)); display: flex; flex-direction: column; gap: calc(6 * var(--u)); font-size: max(12px, calc(15 * var(--u))); color: #C9C6C0; margin-top: calc(8 * var(--u)); }
  .notice b { font-size: max(11px, calc(13 * var(--u))); color: var(--accent); letter-spacing: 0.12em; }
</style>

    <div class="srv" id="artTile"><div class="lab"><span class="vs" id="artVs">VS</span>아티팩트</div><div class="name" id="artName"></div></div>
    <div class="srv" style="background:#B48CFF"><div class="lab"><span class="vs" style="color:#B48CFF">VS</span>시공</div><div class="name" id="sigName"></div></div>
  </section>

  <div class="divider"><span></span><h2>컨텐츠 일정</h2><span></span></div>

  <div class="week" id="week" role="group" aria-label="요일 선택"></div>

  <section class="main" id="main" aria-live="polite"></section>

  <section>
    <p class="sec-lab">고정 일정 · 매일</p>
    <div id="fixed"></div>
  </section>

  <section class="notice">
    <b>공지</b>
    <div>디스코드 가입 및 활동은 필수입니다.</div>
    <div>접속률이 너무 낮거나 디코에서 활동이 없는 경우 정리 대상이 될 수 있습니다.</div>
    <div>디스코드 활동을 적극 부탁드립니다.</div>
  </section>
</main>

<script>
const CONFIG = {
  faction: '서부',
  artifactTime: '22:30',
  artifactServer: '이스할겐 (동부)',
  sigongServer: '바이젤'
};

const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const ORDER = [2, 3, 4, 5, 6, 0, 1];
const MAINS = {
  '화': { time: '22:00', label: '균열지대', sub: '' },
  '목': { time: '22:00', label: '균열지대', sub: '' },
  '수': { time: CONFIG.artifactTime, label: '아티팩트', sub: '' },
  '토': { time: CONFIG.artifactTime, label: '아티팩트', sub: '' },
  '금': { time: '22:30', label: '나흐마', sub: '보스 컨텐츠' },
  '일': { time: '22:30', label: '나흐마', sub: '보스 컨텐츠' }
};
const FIXED = [
  { name: '카이라', times: ['01:00', '09:00', '13:00', '21:00'] },
  { name: '아그로', times: ['09:00', '21:00'] }
];

const el = (id) => document.getElementById(id);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
let selected = null;

function seoulNow() {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', hour12: false, weekday: 'short', hour: 'numeric', minute: 'numeric' }).formatToParts(new Date());
  const g = (t) => parts.find((p) => p.type === t).value;
  const map = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 };
  return { idx: map[g('weekday')], min: (+g('hour') % 24) * 60 + +g('minute') };
}

function eventsFor(dayIdx) {
  const byTime = {};
  FIXED.forEach((f) => f.times.forEach((t) => { (byTime[t] = byTime[t] || []).push(f.name); }));
  const list = Object.entries(byTime).map(([t, names]) => ({ t, name: names.join(' · ') }));
  const mn = MAINS[DAYS[dayIdx]];
  if (mn) list.push({ t: mn.time, name: mn.label });
  return list.sort((a, b) => toMin(a.t) - toMin(b.t));
}

function nextEvent(now) {
  for (let add = 0; add < 8; add++) {
    const idx = (now.idx + add) % 7;
    for (const e of eventsFor(idx)) {
      const diff = add * 1440 + toMin(e.t) - now.min;
      if (diff > 0) return { ...e, diff, add };
    }
  }
  return null;
}

const fmt = (min) => { const h = Math.floor(min / 60), m = min % 60; return h ? `${h}시간 ${m}분` : `${m}분`; };

function renderStatic() {
  const c = CONFIG.faction === '동부' ? '#A178FF' : '#4A8DF8';
  el('artTile').style.background = c; el('artVs').style.color = c;
  el('artName').textContent = CONFIG.artifactServer;
  el('sigName').textContent = CONFIG.sigongServer;
  const fx = el('fixed');
  FIXED.forEach((f) => {
    const box = mk('div', 'boss');
    const who = mk('div', 'who'); who.append(mk('b', null, f.name), mk('small', null, `매일 ${f.times.length}회`));
    const times = mk('div', 'times'); f.times.forEach((t) => times.append(mk('span', null, t)));
    box.append(who, times); fx.append(box);
  });
}

function render() {
  const now = seoulNow();
  if (selected === null) selected = now.idx;

  const wk = el('week'); wk.innerHTML = '';
  ORDER.forEach((i) => {
    const d = DAYS[i], m = MAINS[d];
    const b = mk('button'); b.type = 'button';
    b.setAttribute('aria-pressed', String(i === selected));
    b.setAttribute('aria-label', `${d}요일${i === now.idx ? ' (오늘)' : ''}`);
    if (i === now.idx) b.classList.add('today');
    b.append(mk('span', 'd', d), mk('span', 'c', m ? m.label : '–'));
    b.addEventListener('click', () => { selected = i; render(); });
    wk.append(b);
  });

  const isToday = selected === now.idx, sd = DAYS[selected], mn = MAINS[sd];
  const main = el('main'); main.innerHTML = '';
  if (mn) {
    main.append(mk('div', 'lab', isToday ? '오늘의 메인' : `${sd}요일 메인`));
    const row = mk('div', 'row'); row.append(mk('span', null, mn.time), mk('span', 'n', mn.label)); main.append(row);
    if (mn.sub) main.append(mk('div', 'sub', mn.sub));
  } else {
    main.append(mk('div', 'lab gray', isToday ? '오늘의 메인' : `${sd}요일 메인`));
    main.append(mk('div', 'none', '고정 일정 위주로 참여해 주세요.'));
  }
  if (isToday) {
    const nx = nextEvent(now);
    if (nx) {
      const line = mk('div', 'next');
      line.append('다음 일정', mk('b', null, `${nx.add === 1 ? '내일 ' : ''}${nx.t} ${nx.name}`), mk('span', 'left', `${fmt(nx.diff)} 남음`));
      main.append(line);
    }
  }
}

renderStatic();
render();
setInterval(render, 30000);
</script>
</body>
</html>
